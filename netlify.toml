[build]
  command = "npm run build"
  publish = "dist/client"

# Redirect all routes to index.html for SPA/CSR routing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Serve static assets with higher priority (keeps /profile.jpeg working).
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = true

